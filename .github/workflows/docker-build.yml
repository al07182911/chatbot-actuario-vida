
name: Construccion y validacion Docker

on:
  workflow_dispatch:

jobs:
  docker:
    name: Construir y probar contenedores
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar Docker Compose
        env:
          OPENAI_API_KEY: sk-test-no-real
        run: |
          docker compose config --quiet

      - name: Construir imagenes Docker
        env:
          OPENAI_API_KEY: sk-test-no-real
        run: |
          docker compose build

      - name: Iniciar contenedores
        env:
          OPENAI_API_KEY: sk-test-no-real
        run: |
          docker compose up -d

      - name: Comprobar estado de contenedores
        env:
          OPENAI_API_KEY: sk-test-no-real
        run: |
          docker compose ps

      - name: Verificar FastAPI
        env:
          OPENAI_API_KEY: sk-test-no-real
        run: |
          docker compose exec -T backend python -c \
            "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10); assert r.status == 200; print('FASTAPI HTTP 200')"
      
      - name: Verificar Streamlit
        run: |
          echo "Esperando que Streamlit este disponible..."

          for intento in $(seq 1 30); do

            if curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:8501/_stcore/health; then

              echo ""
              echo "STREAMLIT HTTP 200"
              exit 0

            fi

            echo "Intento $intento: Streamlit aun no disponible"
            sleep 3

          done

          echo "ERROR: Streamlit no respondio."
          exit 1

      
      - name: Verificar comunicacion frontend backend
        env:
          OPENAI_API_KEY: sk-test-no-real
        run: |
          docker compose exec -T frontend python -c \
            "import requests; r=requests.get('http://backend:8000/health', timeout=10); assert r.status_code == 200; print('COMUNICACION FRONTEND BACKEND CORRECTA')"


      - name: Mostrar registros si ocurre un error
        if: failure()
        env:
          OPENAI_API_KEY: sk-test-no-real
        run: |
          docker compose ps -a
          docker compose logs --tail=100

      - name: Detener contenedores
        if: always()
        env:
          OPENAI_API_KEY: sk-test-no-real
        run: |
          docker compose down
